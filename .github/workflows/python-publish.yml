# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
    push:
        branches:
            - main
    release:
        types: [published]

permissions:
    contents: read

jobs:
    release-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  # setuptools-scm needs the release tag and its history to determine
                  # the package version. On a release event, this is the release tag.
                  ref: ${{ github.event.release.tag_name || github.ref }}
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"
            - name: Set release version
              if: github.event_name == 'release'
              run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            - name: Build release distributions
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build

            - name: Build package
              run: python -m build

            - name: Upload distributions
              uses: actions/upload-artifact@v7
              with:
                  name: release-dists
                  path: dist/

    pypi-publish:
        name: Publish release distributions to PyPI
        if: github.event_name == 'release'
        needs:
            - release-build
        runs-on: ubuntu-latest
        permissions:
            id-token: write

        environment:
            name: "pypi"
            # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
            url: https://pypi.org/p/mosaic_proposal_helper
            #
            # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
            # ALTERNATIVE: exactly, uncomment the following line instead:
            # url: https://pypi.org/project/mosaic_proposal_helper/${{ github.event.release.name }}

        steps:
            - name: Retrieve release distributions
              uses: actions/download-artifact@v8
              with:
                  name: release-dists
                  path: dist/
            - name: Publish release distributions to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist/

    testpypi-publish:
        name: Publish release distributions to TestPyPI
        if: github.event_name == 'push'
        needs:
            - release-build
        runs-on: ubuntu-latest
        permissions:
            id-token: write

        environment:
            name: "testpypi"
            # OPTIONAL: uncomment and update to include your TestPyPI project URL in the deployment status:
            url: https://test.pypi.org/p/mosaic_proposal_helper
            #
            # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
            # ALTERNATIVE: exactly, uncomment the following line instead:
            # url: https://test.pypi.org/project/mosaic_proposal_helper/${{ github.event.release.name }}

        steps:
            - name: Retrieve release distributions
              uses: actions/download-artifact@v8
              with:
                  name: release-dists
                  path: dist/
            - name: Publish release distributions to TestPyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist/
                  repository-url: https://test.pypi.org/legacy/
